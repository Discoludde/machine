<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>machine_top — VLSISuite RTL</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #243449; font: 14px system-ui, sans-serif; }
    header { height: 64px; display: flex; align-items: center; gap: 24px; padding: 0 24px;
      border-bottom: 1px solid #d6dee8; background: #17283c; color: #f1f5fa; }
    header strong { letter-spacing: .08em; font-size: 13px; }
    header span { color: #afc2d8; }
    nav { height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 24px;
      background: #f6f8fb; border-bottom: 1px solid #d6dee8; }
    button, a { font: inherit; color: #243449; background: white; border: 1px solid #c7d2df;
      border-radius: 4px; padding: 6px 12px; cursor: pointer; text-decoration: none; }
    button:hover, a:hover { background: #e6eef8; }
    button:focus-visible, a:focus-visible { outline: 2px solid #2266aa; }
    #zoom { min-width: 60px; text-align: center; font-variant-numeric: tabular-nums; }
    .spacer { flex: 1; }
    #viewport { position: relative; height: calc(100vh - 154px); overflow: hidden;
      background-color: #fff; background-image: radial-gradient(#dbe2eb .7px, transparent .7px);
      background-size: 16px 16px; touch-action: none; cursor: grab; }
    #viewport.dragging { cursor: grabbing; }
    #drawing { position: absolute; transform-origin: 0 0; pointer-events: none; user-select: none; max-width: none; }
    footer { height: 38px; display: flex; align-items: center; padding: 0 24px;
      border-top: 1px solid #d6dee8; color: #5b6f85; font-size: 12px; }
  </style>
</head>
<body>
  <header><strong>VLSISUITE</strong><span>/</span><b>machine_top</b><span>RTL schematic</span></header>
  <nav aria-label="Schemakontroller">
    <button id="fit">Anpassa till fönster</button>
    <button id="minus" aria-label="Zooma ut">−</button><span id="zoom">100%</span>
    <button id="plus" aria-label="Zooma in">+</button><button id="actual">1:1</button>
    <span class="spacer"></span><a href="rtl.svg" download>Exportera SVG</a>
  </nav>
  <main id="viewport" tabindex="0" aria-label="RTL-schema. Dra för att panorera, skrolla för att zooma.">
    <img id="drawing" src="rtl.svg" alt="Kretsschema för machine_top" draggable="false">
  </main>
  <footer id="status">RTL · netlistsvg / ELK · Dra för att panorera · Skrolla för att zooma · F för att anpassa</footer>
  <script>
    const viewport = document.querySelector('#viewport');
    const drawing = document.querySelector('#drawing');
    let scale = 1, x = 0, y = 0, drag = null;
    function update() {
      drawing.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
      document.querySelector('#zoom').textContent = `${Math.round(scale * 100)}%`;
    }
    function fit() {
      if (!drawing.naturalWidth) return;
      scale = Math.max(.02, Math.min(2, (viewport.clientWidth - 100) / drawing.naturalWidth,
        (viewport.clientHeight - 100) / drawing.naturalHeight));
      x = (viewport.clientWidth - drawing.naturalWidth * scale) / 2;
      y = (viewport.clientHeight - drawing.naturalHeight * scale) / 2;
      update();
    }
    function zoom(factor, px = viewport.clientWidth / 2, py = viewport.clientHeight / 2) {
      const next = Math.max(.02, Math.min(12, scale * factor));
      x = px - (px - x) * next / scale;
      y = py - (py - y) * next / scale;
      scale = next;
      update();
    }
    drawing.addEventListener('load', fit);
    drawing.addEventListener('error', () => {
      document.querySelector('#status').textContent = 'Kunde inte läsa rtl.svg. Behåll HTML och SVG i samma katalog.';
    });
    if (drawing.complete) fit();
    document.querySelector('#fit').onclick = fit;
    document.querySelector('#plus').onclick = () => zoom(1.25);
    document.querySelector('#minus').onclick = () => zoom(.8);
    document.querySelector('#actual').onclick = () => zoom(1 / scale);
    viewport.addEventListener('wheel', event => {
      event.preventDefault();
      const rect = viewport.getBoundingClientRect();
      zoom(Math.exp(-event.deltaY * .0015), event.clientX - rect.left, event.clientY - rect.top);
    }, {passive: false});
    viewport.addEventListener('pointerdown', event => {
      if (event.button !== 0) return;
      drag = {id: event.pointerId, px: event.clientX, py: event.clientY, x, y};
      viewport.setPointerCapture(event.pointerId);
      viewport.classList.add('dragging');
    });
    viewport.addEventListener('pointermove', event => {
      if (!drag || drag.id !== event.pointerId) return;
      x = drag.x + event.clientX - drag.px;
      y = drag.y + event.clientY - drag.py;
      update();
    });
    function endDrag() { drag = null; viewport.classList.remove('dragging'); }
    viewport.addEventListener('pointerup', endDrag);
    viewport.addEventListener('pointercancel', endDrag);
    viewport.addEventListener('lostpointercapture', endDrag);
    viewport.addEventListener('keydown', event => {
      if (event.key.toLowerCase() === 'f') fit();
      else if (event.key === '+' || event.key === '=') zoom(1.25);
      else if (event.key === '-') zoom(.8);
      else return;
      event.preventDefault();
    });
    window.addEventListener('resize', fit);
  </script>
</body>
</html>
