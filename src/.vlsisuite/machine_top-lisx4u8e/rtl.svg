<svg xmlns="http://www.w3.org/2000/svg" xmlns:s="https://github.com/nturley/netlistsvg" width="54" height="96">
  <style>svg {
    stroke:#000;
    fill:none;
  }
  text {
    fill:#000;
    stroke:none;
    font-size:10px;
    font-weight: bold;
    font-family: "Courier New", monospace;
  }
  .nodelabel {
    text-anchor: middle;
  }
  .inputPortLabel {
    text-anchor: end;
  }
  .splitjoinBody {
    fill:#000;
  }</style>
  <g s:type="inputExt" transform="translate(12,22)" s:width="30" s:height="20" id="cell_clk">
    <text x="15" y="-4" class="nodelabel cell_clk" s:attribute="ref">clk</text>
    <s:alias val="$_inputExt_" />
    <path d="M0,0 L0,20 L15,20 L30,10 L15,0 Z" class="cell_clk" />
    <g s:x="28" s:y="10" s:pid="Y" />
  </g>
  <g s:type="inputExt" transform="translate(12,64)" s:width="30" s:height="20" id="cell_rst">
    <text x="15" y="-4" class="nodelabel cell_rst" s:attribute="ref">rst</text>
    <s:alias val="$_inputExt_" />
    <path d="M0,0 L0,20 L15,20 L30,10 L15,0 Z" class="cell_rst" />
    <g s:x="28" s:y="10" s:pid="Y" />
  </g>
<style>
      svg { stroke: #263b55; }
      text { fill: #263b55; font-family: Arial, sans-serif; font-weight: normal; }
      .nodelabel { font-weight: 600; }
      line[class^="net_"] { stroke: #2875a7; }
      circle[class^="net_"] { fill: #2875a7 !important; stroke: #2875a7; }
